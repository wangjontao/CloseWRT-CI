name: HY3000-DulWiFi

on:
  workflow_dispatch:
    inputs:
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRT_CONFIG: HY3000
  WRT_NAME: DulWiFi
  WRT_SSID: DulWiFi
  WRT_WORD: password
  WRT_IP: 192.168.9.1
  WRT_PW: password
  WRT_REPO: https://github.com/Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly.git
  WRT_BRANCH: openwrt-24.10-6.6
  WRT_SOURCE: Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly
  WRT_TEST: ${{ inputs.TEST }}

jobs:
  build:
    name: HY3000-DulWiFi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox || true
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev openssl jq ccache zstd
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=mediatek" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/
          cd ./wrt/
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          mkdir -p ./dl "$GITHUB_WORKSPACE/.ccache" "$HOME/.cache/go-build" "$HOME/go/pkg/mod"
          if [ ! -d "defconfig" ]; then
            echo "defconfig directory not found, stopping workflow."
            exit 1
          fi
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Restore OpenWrt Cache
        uses: actions/cache@v4
        with:
          path: |
            ./wrt/dl
            ./.ccache
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-hy3000-v4-${{ env.WRT_BRANCH }}-${{ hashFiles('Config/**', '.github/workflows/HY3000-DulWiFi.yml') }}
          restore-keys: |
            ${{ runner.os }}-hy3000-v4-${{ env.WRT_BRANCH }}-
            ${{ runner.os }}-hy3000-v4-

      - name: Check Scripts
        run: |
          find ./ -maxdepth 4 -type f -iregex ".*\(txt\|sh\|yml\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages Fixed
        run: |
          cd ./wrt/package/

          # 不执行原仓库 Scripts/Packages.sh。
          # 原脚本会额外拉 momo/nikki，当前容易触发 mihomo-alpha <-> mihomo-meta 递归依赖。

          echo "Add HomeProxy"
          rm -rf ./homeproxy ./luci-app-homeproxy ../feeds/luci/applications/luci-app-homeproxy 2>/dev/null || true
          git clone --depth=1 --single-branch --branch main https://github.com/VIKINGYFY/homeproxy.git ./homeproxy

          echo "Add OpenClash"
          rm -rf ./OpenClash ./luci-app-openclash ../feeds/luci/applications/luci-app-openclash 2>/dev/null || true
          git clone --depth=1 --single-branch --branch dev https://github.com/vernesong/OpenClash.git ./OpenClash
          find ./OpenClash/*/ -maxdepth 3 -type d -iname "*openclash*" -prune -exec cp -rf {} ./ \;
          rm -rf ./OpenClash

          echo "Add fixed PassWall 26.3.6-1"
          rm -rf ./openwrt-passwall ./luci-app-passwall ./passwall* ../feeds/luci/applications/luci-app-passwall ../feeds/packages/net/*passwall* 2>/dev/null || true
          git clone --depth=1 --single-branch --branch 26.3.6-1 https://github.com/Openwrt-Passwall/openwrt-passwall.git ./openwrt-passwall
          find ./openwrt-passwall/*/ -maxdepth 3 -type d -iname "*passwall*" -prune -exec cp -rf {} ./ \;
          rm -rf ./openwrt-passwall

          echo "Add fixed PassWall2 26.3.5-1"
          rm -rf ./openwrt-passwall2 ./luci-app-passwall2 ./passwall2* ../feeds/luci/applications/luci-app-passwall2 ../feeds/packages/net/*passwall2* 2>/dev/null || true
          git clone --depth=1 --single-branch --branch 26.3.5-1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git ./openwrt-passwall2
          find ./openwrt-passwall2/*/ -maxdepth 3 -type d -iname "*passwall2*" -prune -exec cp -rf {} ./ \;
          rm -rf ./openwrt-passwall2

          echo "Add luci-app-nps / nps"
          rm -rf ./nps-openwrt ./luci-app-nps ./nps ../feeds/luci/applications/luci-app-nps ../feeds/packages/net/nps 2>/dev/null || true
          git clone --depth=1 https://github.com/djylb/nps-openwrt.git ./nps-openwrt
          cp -rf ./nps-openwrt/luci-app-nps ./
          cp -rf ./nps-openwrt/nps ./
          rm -rf ./nps-openwrt

          # 主动删除可能残留的 Momo/Nikki/Mihomo 包，避免 Kconfig 递归依赖。
          find ./ ../feeds/luci/ ../feeds/packages/ -maxdepth 4 -type d \( -iname "*momo*" -o -iname "*nikki*" -o -iname "*mihomo*" \) -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Custom Settings
        run: |
          cd ./wrt/

          if ! grep -R "philips_hy3000" target/linux/mediatek 2>/dev/null; then
            echo "ERROR: 当前源码没有 philips_hy3000 设备定义，不能编译 HY3000。"
            exit 1
          fi

          rm -f .config
          touch .config
          {
            printf '%s\n' 'CONFIG_TARGET_mediatek=y'
            printf '%s\n' 'CONFIG_TARGET_mediatek_filogic=y'
            printf '%s\n' 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_philips_hy3000=y'
            printf '%s\n' '# CONFIG_TARGET_MULTI_PROFILE is not set'
            printf '%s\n' '# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set'
            printf '%s\n' '# CONFIG_TARGET_ROOTFS_INITRAMFS is not set'
            printf '%s\n' 'CONFIG_first_card_name="MT7981"'
            printf '%s\n' 'CONFIG_MTK_CHIP_MT7981=y'
            printf '%s\n' 'CONFIG_MTK_CONNINFRA_APSOC_MT7981=y'
            printf '%s\n' 'CONFIG_MTK_FIRST_IF_MT7981=y'
            printf '%s\n' 'CONFIG_MTK_MT7981_NEW_FW=n'
            printf '%s\n' 'CONFIG_WARP_CHIPSET="mt7981"'
            printf '%s\n' 'CONFIG_WARP_NEW_FW=n'
            cat "$GITHUB_WORKSPACE/Config/PRIVATE.txt"
          } >> .config

          # 修改默认 IP / 主机名。
          CFG_FILE="./package/base-files/files/bin/config_generate"
          [ -f "$CFG_FILE" ] && sed -i "s/192\.168\.[0-9]*\.[0-9]*/$WRT_IP/g" "$CFG_FILE"
          [ -f "$CFG_FILE" ] && sed -i "s/hostname='.*'/hostname='$WRT_NAME'/g" "$CFG_FILE"

          # 修改 MTK Wi-Fi 默认名称、加密和密码。
          WIFI_FILE="./package/mtk/applications/mtwifi-cfg/files/mtwifi.sh"
          if [ -f "$WIFI_FILE" ]; then
            sed -i "s/ImmortalWrt/$WRT_SSID/g" "$WIFI_FILE"
            sed -i "s/encryption=.*/encryption='psk2+ccmp'/g" "$WIFI_FILE"
            grep -q "set wireless.default_\${dev}.key" "$WIFI_FILE" || \
              sed -i "/set wireless.default_\${dev}.encryption='psk2+ccmp'/a \\\t\\\t\\\t\\\t\\\tset wireless.default_\${dev}.key='$WRT_WORD'" "$WIFI_FILE"
          else
            echo "WARNING: mtwifi.sh not found, Wi-Fi defaults may not be patched."
          fi

          # root 密码 password。
          HASH="$(openssl passwd -1 "$WRT_PW")"
          mkdir -p ./package/base-files/files/etc
          SHADOW="./package/base-files/files/etc/shadow"
          if [ -f "$SHADOW" ]; then
            sed -i "s#^root:[^:]*:#root:${HASH}:#" "$SHADOW"
          else
            echo "root:${HASH}:0:0:99999:7:::" > "$SHADOW"
          fi

          # 首次启动双保险：hostname / LAN IP / Wi-Fi。
          mkdir -p ./package/base-files/files/etc/uci-defaults
          cat > ./package/base-files/files/etc/uci-defaults/99-dulwifi <<'EOS'
          #!/bin/sh
          uci -q set system.@system[0].hostname='DulWiFi'
          uci -q commit system
          uci -q set network.lan.ipaddr='192.168.9.1'
          uci -q commit network
          for s in $(uci -q show wireless | sed -n "s/^wireless\.\([^=]*\)=wifi-iface/\1/p"); do
              uci -q set wireless.$s.ssid='DulWiFi'
              uci -q set wireless.$s.encryption='psk2+ccmp'
              uci -q set wireless.$s.key='password'
          done
          uci -q commit wireless
          exit 0
          EOS
          sed -i 's/^          //' ./package/base-files/files/etc/uci-defaults/99-dulwifi
          chmod +x ./package/base-files/files/etc/uci-defaults/99-dulwifi

          # NPS 首次开机自动配置：读取 WAN MAC，生成大写去冒号 vkey。
          cat > ./package/base-files/files/etc/uci-defaults/99-nps-autoconfig <<'EOS'
          #!/bin/sh
          if [ -f /etc/config/nps ] && [ -x /etc/init.d/nps ]; then
              sleep 5
              echo "Start configure NPS..."
              WAN_DEV="$(uci -q get network.wan.device)"
              [ -z "$WAN_DEV" ] && WAN_DEV="$(ip route 2>/dev/null | awk '/default/ {print $5; exit}')"
              echo "WAN_DEV=$WAN_DEV"
              WAN_MAC=""
              if [ -n "$WAN_DEV" ] && [ -f "/sys/class/net/$WAN_DEV/address" ]; then
                  WAN_MAC="$(cat /sys/class/net/$WAN_DEV/address)"
              fi
              if [ -z "$WAN_MAC" ] || [ "$WAN_MAC" = "00:00:00:00:00:00" ]; then
                  LOWER_DEV="$(basename "$(readlink -f /sys/class/net/$WAN_DEV/lower_* 2>/dev/null)" 2>/dev/null)"
                  if [ -n "$LOWER_DEV" ] && [ -f "/sys/class/net/$LOWER_DEV/address" ]; then
                      WAN_MAC="$(cat /sys/class/net/$LOWER_DEV/address)"
                      echo "Use lower device MAC: $LOWER_DEV"
                  fi
              fi
              if [ -z "$WAN_MAC" ] || [ "$WAN_MAC" = "00:00:00:00:00:00" ]; then
                  LAN_DEV="$(uci -q get network.lan.device)"
                  [ -z "$LAN_DEV" ] && LAN_DEV="br-lan"
                  if [ -f "/sys/class/net/$LAN_DEV/address" ]; then
                      WAN_MAC="$(cat /sys/class/net/$LAN_DEV/address)"
                      echo "Fallback to LAN device MAC: $LAN_DEV"
                  fi
              fi
              if [ -n "$WAN_MAC" ] && [ "$WAN_MAC" != "00:00:00:00:00:00" ]; then
                  echo "WAN MAC=$WAN_MAC"
                  NPS_KEY="$(echo "$WAN_MAC" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
                  echo "NPS KEY=$NPS_KEY"
                  uci -q set nps.@nps[0].enable='1'
                  uci -q set nps.@nps[0].enabled='1'
                  uci -q set nps.@nps[0].server_addr='47.83.9.208'
                  uci -q set nps.@nps[0].server_port='8024'
                  uci -q set nps.@nps[0].protocol='tcp'
                  uci -q set nps.@nps[0].compress='1'
                  uci -q set nps.@nps[0].crypt='1'
                  uci -q set nps.@nps[0].vkey="$NPS_KEY"
                  uci -q commit nps
                  /etc/init.d/nps enable
                  /etc/init.d/nps restart
                  echo "NPS configured successfully"
              else
                  echo "ERROR: WAN MAC not found"
              fi
          fi
          exit 0
          EOS
          sed -i 's/^          //' ./package/base-files/files/etc/uci-defaults/99-nps-autoconfig
          chmod +x ./package/base-files/files/etc/uci-defaults/99-nps-autoconfig

          echo "==== .config before defconfig target lines ===="
          grep -nE '^CONFIG_TARGET|TARGET_MULTI|TARGET_PER_DEVICE|philips_hy3000|mihomo|momo|nikki' .config || true

          make defconfig -j$(nproc)

          echo "==== selected target after defconfig ===="
          grep -nE '^CONFIG_TARGET|TARGET_MULTI|TARGET_PER_DEVICE|philips_hy3000|mihomo|momo|nikki' .config || true
          if ! grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_philips_hy3000=y' .config; then
            echo "ERROR: HY3000 profile is not selected after defconfig. Dumping available HY3000 strings:"
            grep -R "hy3000\|HY3000\|philips" target/linux/mediatek -n 2>/dev/null || true
            exit 1
          fi

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/
          echo "======================="
          lscpu | grep -E "name|Core|Thread" || true
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 || true
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/
          mkdir -p ./upload/
          cp -f ./.config ./upload/Config-HY3000-DulWiFi-$WRT_DATE.txt
          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -n1)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV
            find ./bin/targets/ -type f | sort > ./upload/output-file-list.txt
            find ./bin/targets/ -type f \( \
              -iname "*.bin" -o \
              -iname "*.itb" -o \
              -iname "*.img" -o \
              -iname "*.img.gz" -o \
              -iname "*.tar" -o \
              -iname "*.tar.gz" -o \
              -iname "*.tar.xz" -o \
              -iname "*.tar.zst" -o \
              -iname "*.ubi" -o \
              -iname "*.manifest" -o \
              -iname "sha256sums" \
            \) -exec cp -f {} ./upload/ \; || true
            echo "Upload files:"
            ls -lh ./upload/
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HY3000-DulWiFi
          path: ./wrt/upload/*

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: HY3000-DulWiFi-${{ env.WRT_DATE }}
          files: ./wrt/upload/*
          body: |
            HY3000 / Philips HY3000 / MT7981 单设备固件
            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}
            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}
            WIFI名称：${{ env.WRT_SSID }}
            WIFI密码：${{ env.WRT_WORD }}
            主机名：${{ env.WRT_NAME }}
            插件：PassWall 26.3.6-1 / PassWall2 26.3.5-1 / HomeProxy / OpenClash / luci-app-nps
            内核版本：${{ env.WRT_KVER }}
            说明：本版本移除 Momo/Nikki/Mihomo，避免 mihomo 递归依赖；输出 ImageBuilder，后续可快速重打包。
            Luci插件列表：${{ env.WRT_LIST }}
